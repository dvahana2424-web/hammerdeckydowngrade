# Hammer — Steam Deck Stable 1794424036, steamrt64/steamclient.so (ELF64)
# Scanned 2026-11-13 via tools/scan-steamrt64.py
# Wrap model: AceSLS SLSsteam-20261112130346 (pure LD_AUDIT → inner steam after pv-adverb)
#
# Deploy:
#   cp res/config.steamrt64.1794424036.yaml ~/.config/hammersteam/config.yaml
#   ./scripts/deploy-x64-side.sh
#   # NO ~/.steam-disable-steamrt64-client  (stay on steamrt64)
#   LD_AUDIT=~/.local/share/Hammer-x64/hammersteam.so steam
#
# SLSsteam wrap notes (copy this approach):
#   - setup.sh / desktop: env LD_AUDIT=…/SLSsteam.so steam
#   - la_objopen waits for steamclient.so (+ steamui / tier0)
#   - steamwebhelper: strip LD_AUDIT (Hammer now mirrors this)
#   - game spawn: env -u LD_AUDIT (SLSsteam via SpawnGameId; Hammer strips after load())
#   - VFT hooks via CSteamEngine::ProcessIPCFrame → getUser→getAppManager (Decompiler)
#     Hammer still uses RunIPCFrame for LaunchApp/Steamless on 32-bit; x64 Steamless
#     needs that VFT path next (no unique RunIPCFrame yet).

DisableFamilyShareLock: no

DepotResponsePatchEnabled: yes
DepotResponsePatchBypassAuthFailures: yes
InstallAppForceSuccess: yes
DepotResponsePatchDepots: []
DepotDecryptionPattern: ""

UseWhitelist: no
AutoFilterList: yes
AppIds: []
PlayNotOwnedGames: yes
AdditionalApps: []
DlcData: {}
DenuvoGames: {}
AppTokens: {}
FakeOffline: []
FakeAppIds: {}

SafeMode: yes
Notifications: no
WarnHashMissmatch: no
NotifyInit: yes
API: no
Hammerlog: 2
ExtendedLogging: yes

# GetManifestRequestCode — RIP LEA to ContentServerDirectory.GetManifestRequestCode#1
# function entry @ 0x13a5840 (push rbp; mov rbp,rsp; push r14…)
ManifestHookEnabled: yes
GetManifestRequestCodeOffset: 0x13aed60
ManifestPattern: "41 57 41 56 41 89 d6 31 d2 41 55 41 89 f5 31 f6 41 54 49 89 fc 55 53 4c 89 c3 48 81 ec 58 01 00 00"
ManifestProvider: Wudrm
ManifestFallbackProvider: yes
ManifestLocalCacheFallback: no
ManifestLocalCacheFirst: no
ManifestZipballFallback: yes
ManifestZipballMaxBytes: 268435456
ManifestZipballTimeoutSec: 300
ManifestServerUrl: "https://manifest.activateme.workers.dev"
ManifestDepotAllowFromKeys: yes
ManifestDepots: []
ManifestLuastoolsArchive: yes
ManifestPinEnabled: yes

# UserOwnsDepot — call before "missing license for depot" LEA @ 0x13aa811
# unique prologue: push r15; push r14; push r13; mov r13,rdi; …
UserOwnsDepotHookEnabled: yes
UserOwnsDepotOffset: 0x18eb1a0
UserOwnsDepotPattern: "41 57 41 56 41 55 49 89 fd 41 54 55 53 89 d3 48 83 ec 58"

# BuildDepotDependency — pattern "4D 85 FF 88 44 24" at 0x1079787 is mid-function.
# Entry is 0x1079640 (41 57 4D 89 CF, int3 pad, RIP lea to the symbol at +0x6f).
BuildDepotDependencyOffset: 0x1079640
BuildDepotDependencyPattern: "4D 85 FF 88 44 24"

# Runs from CUser::SpawnGameId (every exe launch), before the process starts.
SteamlessAutoPatchEnabled: yes

NetPacketHooksEnabled: no
NetPacketLogOnly: no
NetPacketAllowHeuristicRecv: no
BBuildAndAsyncSendFrameOffset: 0
RecvPktOffset: 0

AllowMissingPatterns: yes
AutoRediscoverPatterns: no

PatternOverrides:
  # Live SLSsteam x86_64 catalog (1-hit on this steamclient)
  CUser::CheckAppOwnership: "48 89 E8 31 ED"
  CUser::GetSubscribedApps: "EB ? 41 8B 50"
  CSteamEngine::SetAppIdForCurrentPipe: "0F 43 C6 83 FB"
  CSteamEngine::m_pUser: "4C 03 A5 ? ? ? ? 48 89 DF 4C 89 E2 E8 ? ? ? ? 49 8B 74 24"
  IClientUtils::m_PipeIndex: "8B B7 ? ? ? ? 64 48 8B 1C 25 ? ? ? ? 48 89 5C 24 ? 48 89 FB 48 81 EF"
  TraceIPC: "48 89 D7 C1 E8"
  # Skip until unique x64 signatures / VFT path (SLSsteam style) exist
  IClientAppManager::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  IClientApps::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  IClientRemoteStorage::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  IClientUGC::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  IClientUserStats::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  IClientUtils::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  IClientUser::RunIPCFrame: "de ad be ef 00 11 22 33 44 55 66 77"
  CProtoBufMsgBase::InitFromPacket: "de ad be ef 00 11 22 33 44 55 66 77"
  CProtoBufMsgBase::Send: "de ad be ef 00 11 22 33 44 55 66 77"
  CAPIJob::GetPlayerStats: "de ad be ef 00 11 22 33 44 55 66 77"
  CSteamEngine::Init: "de ad be ef 00 11 22 33 44 55 66 77"
