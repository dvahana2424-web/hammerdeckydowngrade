# Hammer config overlay for Steam Deck Stable 1794424036 working
# Verified 2026-11-12: fake ownership (Tunic 553420 Play), GetManifest
# (Strikers 1279380 via Wudrm), manifest pin (BuildDepotDependency @ 0x11843c0).
#
# Requires ELF32 hammersteam.so AND the 32-bit client:
#   touch ~/.local/share/Steam/.steam-disable-steamrt64-client
#   # or: STEAM_FORCE_CLIENT=ubuntu12_32
# Copy over ~/.config/hammersteam/config.yaml and restart Steam.
# See progressreport.txt (top) for the full flag table.
#
# 1794424036: FamilyGroup retn patches can land on the wrong fn after the client shift.
DisableFamilyShareLock: no

DepotResponsePatchEnabled: yes
DepotResponsePatchBypassAuthFailures: yes
InstallAppForceSuccess: yes
DepotResponsePatchDepots: []
DepotDecryptionPattern: ""

UseWhitelist: no
AutoFilterList: yes
AppIds: []

PlayNotOwnedGames: yes

AdditionalApps: []

DlcData: {}
DenuvoGames: {}
AppTokens: {}
FakeOffline: []
FakeAppIds: {}

IdleStatus:
  AppId: 0
  Title: ""

GameTitles: {}
SubscriptionTimestamps: {}

SafeMode: yes
Notifications: no
WarnHashMissmatch: no
NotifyInit: yes
API: no

FakeEmail: ""
FakeWalletBalance: 0

Hammerlog: 2
ExtendedLogging: yes

# 1794424036: unique RPC LEA to ContentServerDirectory.GetManifestRequestCode#1.
# Real entry is Shape A PIC at vaddr 0x1505200 (inner 55 89 e5 is +10).
# Keep protobuf InitFromPacket skipped — that was the 15:26 SIGSEGV.
ManifestHookEnabled: yes
ManifestPattern: "e8 ? ? ? ? 05 ? ? ? ? 55 89 e5 57 56 53 81 ec 20 01 00 00 8b 7d 08 8b 4d 20"
GetManifestRequestCodeOffset: 0x1505200
ManifestProvider: Wudrm
ManifestFallbackProvider: yes
ManifestLocalCacheFallback: no
ManifestLocalCacheFirst: no
ManifestZipballFallback: yes
ManifestZipballMaxBytes: 268435456
ManifestZipballTimeoutSec: 300
ManifestServerUrl: "https://manifest.activateme.workers.dev"
ManifestDepotAllowFromKeys: yes
ManifestDepots: []
ManifestLuastoolsArchive: yes

OwnershipTicketDiskFallback: no

UserOwnsDepotHookEnabled: yes
UserOwnsDepotOffset: 0x1a01410
UserOwnsDepotPattern: "55 e8 ? ? ? ? 81 c5 ? ? ? ? 57 56 53 83 ec 74 ff b4 24"

SteamlessAutoPatchEnabled: yes
SteamlessCliPath: "~/.config/hammersteam/SteamlessCLI"
SteamlessCliTimeoutSeconds: 120
SteamlessRecursiveScan: yes
SteamlessQuiet: yes
SteamlessAppIds: []

DepotDecryptionKeys: {}

StatSteamIds: {}

NetPacketHooksEnabled: no
NetPacketLogOnly: no
NetPacketAllowHeuristicRecv: no
BBuildAndAsyncSendFrameOffset: 0
RecvPktOffset: 0

AllowMissingPatterns: yes
